<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BoS Verifier{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <h1><a href="{{ url_for('index') }}" style="text-decoration:none">BoS Verifier</a></h1>
      <p>Checks a scanned Board of Studies against the IQAC / UGC checklist</p>
    </div>
  </header>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
</body>
</html>
